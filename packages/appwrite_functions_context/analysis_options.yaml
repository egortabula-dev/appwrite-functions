include: package:lints/recommended.yaml

# Backend util keeps very_good_analysis (its own ruleset — ADR-002), not
# widgy_lints. The rules below are downgraded to non-fatal *for this
# package only*: they are either inherent to wrapping Appwrite's dynamic Cloud
# Functions context (dynamic field access, broad catches in the logger) or
# analyzer-version drift surfaced after this package's last standalone release.
# Tracked for a dedicated cleanup; suppressed here so it integrates clean.
analyzer:
  errors:
    avoid_dynamic_calls: ignore
    cascade_invocations: ignore
    avoid_catches_without_on_clauses: ignore
    unintended_html_in_doc_comment: ignore
    unnecessary_null_comparison: ignore
    inference_failure_on_collection_literal: ignore
