name: appwrite_functions_context
description: Type-safe wrapper for the Appwrite Cloud Functions context, with strongly typed request, response, headers, environment variables and logging.
version: 0.4.0
repository: https://github.com/egortabula-dev/appwrite-functions
issue_tracker: https://github.com/egortabula-dev/appwrite-functions/issues

# Kept off pub.dev until the first public release is deliberate.
publish_to: none

topics:
  - appwrite
  - functions
  - serverless
  - backend

# The floor is 3.8 for two reasons. The code uses null-aware elements, a 3.8
# language feature. And Appwrite's oldest runtimes still in use are old: it
# ships Dart 3.0, 3.1, 3.3, 3.5, 3.8, 3.10 and 3.11, so a wrapper that demands
# a newer SDK simply cannot be loaded by half of them.
environment:
  sdk: ^3.8.0

# Member of the root pub workspace.
resolution: workspace

dev_dependencies:
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.25.0
