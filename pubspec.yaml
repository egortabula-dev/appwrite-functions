# Root of the appwrite-functions monorepo.
#
# A Dart pub workspace: one shared resolution for every package under
# packages/. There is no melos here on purpose — it would drag the whole
# workspace floor up to Dart 3.9, while these packages must stay loadable by
# Appwrite's older runtimes. Versioning and changelogs come from
# release-please instead, driven by conventional commits.
name: appwrite_functions_workspace
publish_to: none

environment:
  sdk: ^3.8.0

workspace:
  - packages/appwrite_functions_context
